<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>게시글 수정</title>
    <style>
        body { font-family: sans-serif; background-color: #FFFFFF; color: #3D2314; padding: 40px; }
        .card { max-width: 500px; margin: 0 auto; padding: 30px; border: 1px solid #EAE3D9; border-radius: 12px; }
        input, textarea { width: 100%; padding: 8px; margin: 8px 0 15px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #3D2314; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>게시글 수정</h2>
    <form action="/board/edit" method="post">
        <input type="hidden" name="id" th:value="${board.id}">
        제목: <input type="text" name="title" th:value="${board.title}" required>
        내용: <textarea name="content" th:text="${board.content}" style="height: 120px;" required></textarea>
        <button type="submit">수정 완료</button>
    </form>
    <br>
    <a href="/board" style="color:#3D2314; text-align:center; display:block;">취소</a>
</div>
</body>
</html>
