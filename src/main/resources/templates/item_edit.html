<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>상품 수정</title>
    <style>
        body { font-family: sans-serif; background-color: #FFFFFF; color: #3D2314; padding: 40px; }
        .card { max-width: 550px; margin: 0 auto; padding: 30px; border: 1px solid #EAE3D9; border-radius: 12px; }
        input, select, textarea { width: 100%; padding: 8px; margin: 8px 0 15px 0; box-sizing: border-box; }
        textarea { height: 100px; }
        button { width: 100%; padding: 12px; background-color: #3D2314; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>상품 정보 수정</h2>
    <form action="/admin/item/edit" method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" th:value="${item.id}">
        카테고리:
        <select name="category">
            <option value="컴퓨터" th:selected="${item.category == '컴퓨터'}">컴퓨터</option>
            <option value="노트북" th:selected="${item.category == '노트북'}">노트북</option>
        </select>
        상품명: <input type="text" name="name" th:value="${item.name}" required>
        가격: <input type="number" name="price" th:value="${item.price}" required>
        수량(재고): <input type="number" name="stock" th:value="${item.stock}" required>
        상품 상세 설명: <textarea name="description" th:text="${item.description}"></textarea>
        이미지 변경 (선택): <input type="file" name="imageFile" accept="image/*">
        <button type="submit">수정 완료</button>
    </form>
    <br>
    <a href="/admin" style="color:#3D2314; text-align:center; display:block;">취소하고 돌아가기</a>
</div>
</body>
</html>
