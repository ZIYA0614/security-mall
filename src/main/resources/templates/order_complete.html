<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 완료</title>
    <style>
        body { font-family: sans-serif; background-color: #FFFFFF; color: #3D2314; padding: 40px; }
        .container { max-width: 700px; margin: 0 auto; text-align: center; border: 1px solid #EAE3D9; padding: 40px; border-radius: 12px; background-color: #FDFBF7; }
        .status-badge { display: inline-block; background-color: #2E7D32; color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; margin-bottom: 20px; }
        .info-table { width: 100%; border-collapse: collapse; margin: 25px 0; text-align: left; }
        .info-table th, .info-table td { padding: 12px; border-bottom: 1px solid #EAE3D9; }
        .btn-home { background-color: #3D2314; color: white; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎉 주문 및 결제가 완료되었습니다!</h2>
    <span class="status-badge" th:text="'주문 상태: ' + ${order.status}">결제 완료</span>

    <table class="info-table" th:if="${order != null}">
        <tr>
            <th>주문 번호</th>
            <td th:text="${order.merchantUid}"></td>
        </tr>
        <tr>
            <th>결제 일시</th>
            <td th:text="${order.createdDate}"></td>
        </tr>
        <tr>
            <th>받는 사람</th>
            <td th:text="${order.buyerName}"></td>
        </tr>
        <tr>
            <th>연락처</th>
            <td th:text="${order.buyerPhone}"></td>
        </tr>
        <tr>
            <th>배송 주소</th>
            <td th:text="${order.buyerAddr}"></td>
        </tr>
        <tr>
            <th>총 결제 금액</th>
            <td><b style="color: #8C5A3C;" th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'"></b></td>
        </tr>
    </table>

    <a href="/" class="btn-home">메인 화면으로 돌아가기</a>
</div>
</body>
</html>
