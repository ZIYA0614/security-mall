<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지</title>
    <style>
        body { font-family: sans-serif; background-color: #FFFFFF; color: #3D2314; padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h2 { border-bottom: 2px solid #3D2314; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 40px; }
        th, td { border: 1px solid #EAE3D9; padding: 12px; text-align: center; }
        th { background-color: #F8F5F0; }
        .btn { background: #3D2314; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn-danger { background: #A33B20; }
        .btn-edit { background: #8C5A3C; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-flex">
        <h2>🛠️ 관리자 전용 페이지</h2>
        <a href="/" class="btn">쇼핑몰 메인으로</a>
    </div>

    <div class="header-flex" style="margin-top: 20px;">
        <h3>📦 상품 관리</h3>
        <a href="/admin/item/add" class="btn">+ 새 상품 등록</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>카테고리</th>
            <th>상품명</th>
            <th>가격</th>
            <th>재고</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.category}"></td>
            <td th:text="${item.name}"></td>
            <!-- 금액 쉼표(,) 포맷팅 적용 부분 -->
            <td th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'"></td>
            <td th:text="${item.stock} + '개'"></td>
            <td>
                <a th:href="@{/admin/item/edit/{id}(id=${item.id})}" class="btn btn-edit">수정</a>
                <form th:action="@{/admin/item/delete/{id}(id=${item.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('상품을 삭제하시겠습니까?');">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h3>👥 회원 관리</h3>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>아이디</th>
            <th>이름</th>
            <th>전화번호</th>
            <th>주소</th>
            <th>권한</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.name}"></td>
            <td th:text="${u.phone}"></td>
            <td th:text="${u.address}"></td>
            <td th:text="${u.role}"></td>
            <td>
                <form th:action="@{/admin/user/delete/{id}(id=${u.id})}" method="post" style="display:inline;" th:if="${u.role != 'ADMIN'}">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('회원을 강퇴/삭제하시겠습니까?');">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
