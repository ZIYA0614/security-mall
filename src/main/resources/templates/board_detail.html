<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>게시글 보기</title>
    <style>
        body { font-family: sans-serif; background-color: #FFFFFF; color: #3D2314; padding: 40px; }
        .card { max-width: 700px; margin: 0 auto; padding: 30px; border: 1px solid #EAE3D9; border-radius: 12px; }
        .meta { color: #8C5A3C; font-size: 14px; border-bottom: 1px solid #EAE3D9; padding-bottom: 10px; margin-bottom: 20px; }
        .content { white-space: pre-line; min-height: 150px; line-height: 1.6; }
        button { background: #3D2314; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
        .btn-danger { background: #A33B20; }
    </style>
</head>
<body>
<div class="card">
    <h2 th:text="${board.title}"></h2>
    <div class="meta">
        작성자: <b th:text="${board.writer}"></b> |
        작성일: <span th:text="${board.createdDate}"></span> |
        조회수: <span th:text="${board.views}"></span>
    </div>
    <div class="content" th:text="${board.content}"></div>
    <hr>
    <a href="/board"><button type="button">목록으로</button></a>
    <a th:if="${loginUser != null && loginUser.username == board.writerUsername}" th:href="@{/board/edit/{id}(id=${board.id})}">
        <button type="button">수정</button>
    </a>
    <form th:if="${loginUser != null && (loginUser.username == board.writerUsername || loginUser.role == 'ADMIN')}"
          th:action="@{/board/delete/{id}(id=${board.id})}" method="post" style="display:inline;">
        <button type="submit" class="btn-danger" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
    </form>
</div>
</body>
</html>
