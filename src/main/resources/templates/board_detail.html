<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
    <style>
        body { font-family: sans-serif; background-color: #FFFFFF; color: #3D2314; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; border: 1px solid #EAE3D9; padding: 30px; border-radius: 8px; }
        .meta-info { color: #777; font-size: 0.9em; border-bottom: 1px solid #EAE3D9; padding-bottom: 10px; margin-bottom: 20px; }
        .content { min-height: 150px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 20px; }
        button { background: #3D2314; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2 th:text="${board.title}">제목</h2>
    <div class="meta-info">
        작성자: <span th:text="${board.writer}"></span> |
        작성일: <span th:text="${board.formattedDate}"></span> |
        조회수: <span th:text="${board.views}"></span>
    </div>

    <div class="content" th:text="${board.content}">내용</div>

    <div>
        <a href="/board"><button type="button">목록으로</button></a>
    </div>
</div>
</body>
</html>
