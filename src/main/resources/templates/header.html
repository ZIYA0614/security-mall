<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="headerFragment">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #FFFFFF; color: #3D2314; margin: 0; padding: 0; font-weight: 600; }

        /* 하늘 배경 (높이 180px) */
        .header-banner { position: relative; height: 180px; background: linear-gradient(rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.35)), url('/sky.jpg'); background-size: cover; background-position: center; }
        .header-title { position: absolute; top: 35px; left: 50px; font-size: 38px; font-weight: 800; color: #FFFFFF; text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.15); }

        /* 상단 고정 메뉴바 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 80px;
            background-color: #F9F7F3;
            border-bottom: 1px solid #EAE3D9;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .nav-left a, .nav-right a { color: #3D2314; text-decoration: none; margin: 0 12px; font-size: 16px; font-weight: 700; }
        .search-box { padding: 7px 14px; border: 1px solid #C4B5A5; border-radius: 20px; background-color: #FFFFFF; }
    </style>

    <div class="header-banner">
        <div class="header-title">보안 실습 쇼핑몰</div>
    </div>

    <div class="navbar">
        <div class="nav-left">
            <a href="/">전체상품</a>
            <a th:each="cat : ${categories}" th:href="@{/(category=${cat})}" th:text="${cat}"></a>
            <a href="/board" style="color: #8C5A3C;">게시판</a>
        </div>
        <div class="nav-right">
            <form action="/" method="get" style="display:inline;">
                <input type="text" name="keyword" class="search-box" placeholder="검색어 입력...">
                <button type="submit" style="background:#3D2314; color:white; border:none; border-radius:15px; padding:6px 12px; cursor:pointer;">검색</button>
            </form>
            <span th:if="${loginUser == null}">
                <a href="/login">로그인</a>
                <a href="/signup">회원가입</a>
            </span>
            <span th:if="${loginUser != null}">
                <span style="margin-right: 10px;"><b>[[${loginUser.name}]]</b>님</span>
                <a href="/logout">로그아웃</a>
                <a href="/admin" th:if="${loginUser.role == 'ADMIN'}" style="color: #A33B20;">[관리자]</a>
            </span>
            <a href="/cart">장바구니</a>
        </div>
    </div>
</div>

</body>
</html>
